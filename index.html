<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MOHIT MARKETING</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #e0ffe0;
    }
    header {
      background-color: #66bb6a;
      color: white;
      text-align: center;
      padding: 1rem;
      font-size: 1.8rem;
      font-weight: bold;
    }
    .toolbar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 1rem;
    }
    .toolbar button {
      padding: 10px 15px;
      font-size: 1rem;
      border: none;
      background-color: #4caf50;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    .toolbar button:hover {
      background-color: #388e3c;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
      padding: 1rem;
    }
    .product {
      background-color: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }
    .product img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      background: #f8f8f8;
    }
    .product-info {
      padding: 0.8rem;
    }
    .product-info h2 {
      font-size: 1.2rem;
      margin: 0 0 0.5rem;
    }
    .product-info p {
      font-size: 0.9rem;
      margin: 0.3rem 0;
    }
    .product-info strong {
      display: block;
      margin-top: 0.5rem;
      font-size: 1rem;
      color: #222;
    }
  </style>
</head>
<body>
  <header>MOHIT MARKETING</header>
  <div class="toolbar">
    <button onclick="addProduct()">Add Product</button>
    <button onclick="exportJSON()">Export JSON</button>
    <input type="file" id="importInput" onchange="importJSON()" style="display:none" />
    <button onclick="document.getElementById('importInput').click()">Import JSON</button>
    <button onclick="downloadViewerHTML()">Download Catalogue</button>
  </div>
  <div class="grid" id="productGrid"></div>

  <script>
    let db;
    const DB_NAME = "CatalogueDB";
    const DB_STORE = "products";

    const request = indexedDB.open(DB_NAME, 1);

    request.onupgradeneeded = (event) => {
      db = event.target.result;
      db.createObjectStore(DB_STORE, { keyPath: "id", autoIncrement: true });
    };

    request.onsuccess = (event) => {
      db = event.target.result;
      displayProducts();
    };

    function displayProducts() {
      const tx = db.transaction(DB_STORE, "readonly");
      const store = tx.objectStore(DB_STORE);
      const request = store.getAll();

      request.onsuccess = () => {
        const grid = document.getElementById("productGrid");
        grid.innerHTML = "";
        for (const p of request.result) {
          const div = document.createElement("div");
          div.className = "product";
          div.innerHTML = `
            <img src="${p.image}" alt="${p.name}">
            <div class="product-info">
              <h2>${p.name}</h2>
              <p>${p.description}</p>
              <strong>₹${p.price}</strong>
            </div>`;
          grid.appendChild(div);
        }
      };
    }

    function addProduct() {
      const name = prompt("Enter product name:");
      if (!name) return;
      const description = prompt("Enter product description:");
      const price = prompt("Enter product price:");
      const imageFile = prompt("Paste image URL or base64:");

      const tx = db.transaction(DB_STORE, "readwrite");
      const store = tx.objectStore(DB_STORE);
      store.add({ name, description, price, image: imageFile });

      tx.oncomplete = () => displayProducts();
    }

    function exportJSON() {
      const tx = db.transaction(DB_STORE, "readonly");
      const store = tx.objectStore(DB_STORE);
      const request = store.getAll();

      request.onsuccess = () => {
        const json = JSON.stringify(request.result);
        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "catalogue.json";
        a.click();
      };
    }

    function importJSON() {
      const fileInput = document.getElementById("importInput");
      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = (e) => {
        const products = JSON.parse(e.target.result);
        const tx = db.transaction(DB_STORE, "readwrite");
        const store = tx.objectStore(DB_STORE);
        for (const p of products) {
          delete p.id;
          store.add(p);
        }
        tx.oncomplete = () => displayProducts();
      };

      if (file) reader.readAsText(file);
    }

    function downloadViewerHTML() {
      const tx = db.transaction(DB_STORE, "readonly");
      const store = tx.objectStore(DB_STORE);
      const request = store.getAll();

      request.onsuccess = () => {
        const products = request.result;
        let viewerHTML = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalogue</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: blue;
    }
    header {
      background-color: lawnGreen;
      color: black;
      padding: 1rem;
      text-align: center;
      font-size: 1.8rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      padding: 1rem;
    }
    .product {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }
    .product img {
      width: 100%;
      height: 250px;
      object-fit: contain;
    }
    .product-info {
      padding: 0.8rem;
    }
    .product-info h2 {
      font-size: 1.1rem;
      margin: 0 0 0.5rem;
    }
    .product-info p {
      font-size: 0.9rem;
      margin: 0.3rem 0;
    }
    .product-info strong {
      display: block;
      margin-top: 0.5rem;
      font-size: 1rem;
      color: #222;
    }
    footer {
      text-align: center;
      padding: 1rem;
      background-color: #f1f1f1;
      font-size: 0.9rem;
      color: lawnGreen;
    }
  </style>
</head>
<body>
  <header>Product Catalogue</header>
  <div class="grid">`;

        for (const p of products) {
          viewerHTML += `
    <div class="product">
      <img src="${p.image}" alt="${p.name}">
      <div class="product-info">
        <h2>${p.name}</h2>
        <p>${p.description}</p>
        <strong>₹${p.price}</strong>
      </div>
    </div>`;
        }

        viewerHTML += `
  </div>
  <footer>Mohit Marketing - All rights reserved.</footer>
</body>
</html>`;

        const blob = new Blob([viewerHTML], { type: "text/html" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "catalogue-viewer.html";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };
    }
  </script>
</body>
</html>
